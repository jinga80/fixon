<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>FixOn 모바일 컴패니언</title>
<!-- ===== Open Graph / KakaoTalk / SMS / Slack ===== -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FixOn">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="FixOn 모바일 컴패니언">
<meta property="og:description" content="현장에서 바로 쓰는 터치 최적화 뷰. 알림·주문 진행·간편 액션.">
<meta property="og:image" content="https://fixon-production.up.railway.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FixOn — 맞춤형 구강 케어 운영 플랫폼">
<meta property="og:url" content="https://fixon-production.up.railway.app/erp-mobile.html">

<!-- ===== Twitter Card ===== -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FixOn 모바일 컴패니언">
<meta name="twitter:description" content="현장에서 바로 쓰는 터치 최적화 뷰. 알림·주문 진행·간편 액션.">
<meta name="twitter:image" content="https://fixon-production.up.railway.app/og-image.png">

<!-- ===== Favicon / PWA ===== -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#ff6b2b">
<meta name="apple-mobile-web-app-title" content="FixOn">
<meta name="application-name" content="FixOn">

<!-- ===== SEO ===== -->
<meta name="description" content="현장에서 바로 쓰는 터치 최적화 뷰. 알림·주문 진행·간편 액션.">
<meta name="author" content="FixOn × Graphy">
<link rel="canonical" href="https://fixon-production.up.railway.app/erp-mobile.html">

<link rel="stylesheet" href="assets/design-system.css">
<style>
*{-webkit-tap-highlight-color:transparent;}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg-section);}
.app-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
.app-header h1{font-size:20px;font-weight:800;letter-spacing:-0.025em;}
.app-header .desktop-link{font-size:13px;color:var(--accent);font-weight:600;}
.role-pill{padding:7px 14px;background:#fff;border:1px solid var(--border);border-radius:100px;font-size:13px;display:flex;gap:7px;align-items:center;cursor:pointer;font-weight:500;}
.role-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.tab-content{padding:18px;display:none;}
.tab-content.active{display:block;}
.section-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin:22px 4px 10px;font-weight:700;}
.section-h:first-child{margin-top:0;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm);}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
.kpi .v{font-family:var(--fd);font-size:28px;font-weight:800;margin-top:8px;line-height:1;letter-spacing:-0.03em;color:var(--text);font-feature-settings:"tnum";}
.kpi.accent .v{color:var(--accent);}
.kpi.green .v{color:var(--green);}
.kpi.blue .v{color:var(--blue);}
.kpi.purple .v{color:var(--purple);}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.order-card{display:flex;align-items:center;gap:14px;}
.order-card .o-info{flex:1;min-width:0;}
.order-card .o-id{font-family:var(--fm);font-size:12px;color:var(--muted);font-weight:600;}
.order-card .o-name{font-weight:600;font-size:16px;margin-top:3px;color:var(--text);}
.order-card .o-meta{font-size:13.5px;color:var(--dim);margin-top:3px;}
.st-active{background:var(--blue-dim);color:var(--blue);padding:4px 11px;border-radius:100px;font-size:12.5px;font-weight:600;display:inline-block;}
.st-pending{background:var(--yellow-dim);color:var(--yellow);padding:4px 11px;border-radius:100px;font-size:12.5px;font-weight:600;display:inline-block;}
.st-progress{background:var(--purple-dim);color:var(--purple);padding:4px 11px;border-radius:100px;font-size:12.5px;font-weight:600;display:inline-block;}
.st-done{background:var(--green-dim);color:var(--green);padding:4px 11px;border-radius:100px;font-size:12.5px;font-weight:600;display:inline-block;}
.st-applied{background:var(--accent-soft);color:var(--accent-deep);padding:4px 11px;border-radius:100px;font-size:12.5px;font-weight:600;display:inline-block;}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,0.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:50;}
.tabbar button{flex:1;background:transparent;border:none;color:var(--muted);font-family:var(--fb);font-size:11.5px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;}
.tabbar button.active{color:var(--accent);}
.tabbar button .icon{font-size:22px;}
.fab{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));right:24px;width:60px;height:60px;border-radius:30px;background:var(--accent);color:#fff;border:none;font-size:30px;cursor:pointer;box-shadow:0 8px 24px var(--accent-glow);z-index:40;}
.scan-frame{aspect-ratio:1;border:3px dashed var(--accent);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:54px;opacity:0.5;margin-bottom:18px;background:var(--accent-soft);}
.search-input{width:100%;padding:13px 16px;font-size:15px;}
.btn{padding:13px 22px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:var(--fb);cursor:pointer;width:100%;}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border);}
.notif-item{padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.notif-item.unread{border-left:3px solid var(--accent);}
.notif-item .msg{font-size:14.5px;margin-bottom:5px;color:var(--text);line-height:1.55;}
.notif-item .time{font-size:12px;color:var(--muted);font-family:var(--fm);font-weight:500;}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:100;display:none;}
.sheet-bg.open{display:block;}
.sheet{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:16px 22px calc(24px + env(safe-area-inset-bottom));z-index:101;transform:translateY(100%);transition:transform 0.25s;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:44px;height:5px;background:var(--border-strong);border-radius:3px;margin:0 auto 18px;}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:12px;}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;font-size:15px;}
</style>
</head>
<body>
<header class="app-header">
  <div>
    <h1>📱 FixOn</h1>
    <a href="erp.html" class="desktop-link">데스크탑 보기 →</a>
  </div>
  <div class="role-pill" onclick="cycleRole()"><span class="dot"></span><span id="role-name">FixOn</span></div>
</header>

<div class="tab-content active" data-tab="home" id="t-home"></div>
<div class="tab-content" data-tab="orders" id="t-orders"></div>
<div class="tab-content" data-tab="scan" id="t-scan"></div>
<div class="tab-content" data-tab="messages" id="t-messages"></div>
<div class="tab-content" data-tab="settings" id="t-settings"></div>

<button class="fab" onclick="openSheet('new-order')" id="fab">+</button>

<nav class="tabbar">
  <button class="active" data-tab="home" onclick="setTab('home',this)"><span class="icon">🏠</span><span>홈</span></button>
  <button data-tab="orders" onclick="setTab('orders',this)"><span class="icon">📋</span><span>주문</span></button>
  <button data-tab="scan" onclick="setTab('scan',this)"><span class="icon">📷</span><span>스캔</span></button>
  <button data-tab="messages" onclick="setTab('messages',this)"><span class="icon">🔔</span><span>알림</span></button>
  <button data-tab="settings" onclick="setTab('settings',this)"><span class="icon">⚙️</span><span>설정</span></button>
</nav>

<div class="sheet-bg" id="sheet-bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-body"></div>
</div>

<script>
const KEY='fixon-erp-state-v6';
const ROLE_LABEL={clinic:'치과',lab:'기공소',graphy:'그래피',fixon:'FixOn'};
const ROLES=['clinic','lab','graphy','fixon'];
const STATUS_LABEL={received:'접수',design_queued:'디자인 대기',designing:'디자인 중',design_done:'디자인 완료',print_queued:'생산 대기',printing:'인쇄 중',assembling:'조립 중',qc:'품질검수',shipping:'배송 중',delivered:'수령 완료',applied:'환자 적용',settled:'정산 완료',rescan_requested:'재스캔 요청'};
const STATUS_FLOW=['received','design_queued','designing','design_done','print_queued','printing','assembling','qc','shipping','delivered','applied','settled'];
function statusProgressIdx(s){const i=STATUS_FLOW.indexOf(s);return i>=0?i:(s==='rescan_requested'?1:0);}
let state=null,currentTab='home',currentRole='fixon';
function load(){try{state=JSON.parse(localStorage.getItem(KEY));}catch(e){}return state;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function fmtKRW(n){return '₩'+Math.round(n).toLocaleString('ko-KR');}
function fmtRel(iso){const d=(Date.now()-new Date(iso))/60000;if(d<1)return '방금';if(d<60)return Math.floor(d)+'분 전';if(d<1440)return Math.floor(d/60)+'시간 전';return Math.floor(d/1440)+'일 전';}
function statusKlass(s){if(['received','shipping'].includes(s))return 'st-active';if(['design_queued','print_queued'].includes(s))return 'st-pending';if(['designing','printing','assembling','qc'].includes(s))return 'st-progress';if(['design_done','delivered','settled'].includes(s))return 'st-done';return 'st-applied';}

function setTab(t,el){currentTab=t;document.querySelectorAll('.tab-content').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();}
function cycleRole(){const i=ROLES.indexOf(currentRole);currentRole=ROLES[(i+1)%4];document.getElementById('role-name').textContent=ROLE_LABEL[currentRole];render();}

function render(){
  if(!load()){document.getElementById('t-home').innerHTML='<div class="empty">⚠️ 데이터 없음<br><br><a href="erp.html" style="color:var(--accent);">데스크탑 ERP</a>를 먼저 열어주세요</div>';return;}
  const fns={home:rHome,orders:rOrders,scan:rScan,messages:rMessages,settings:rSettings};
  document.getElementById('t-'+currentTab).innerHTML=fns[currentTab]();
}

function rHome(){
  const today=new Date().toDateString();
  const todayOrders=state.orders.filter(o=>new Date(o.createdAt).toDateString()===today);
  const inProgress=state.orders.filter(o=>!['settled'].includes(o.status));
  const urgent=state.orders.filter(o=>{const age=(Date.now()-new Date(o.createdAt))/3600000;return age>72&&!['settled','applied','delivered'].includes(o.status);});
  const revenue=state.orders.filter(o=>o.status==='settled').reduce((s,o)=>s+(o.pricing.fixon_fee||0),0);
  return `<div class="kpi-grid">
    <div class="kpi accent"><div class="l">진행 중</div><div class="v">${inProgress.length}</div></div>
    <div class="kpi blue"><div class="l">오늘</div><div class="v">${todayOrders.length}</div></div>
    <div class="kpi purple"><div class="l">긴급 처리</div><div class="v">${urgent.length}</div></div>
    <div class="kpi green"><div class="l">FixOn 누적</div><div class="v" style="font-size:14px;">${fmtKRW(revenue)}</div></div>
  </div>
  <div class="section-h">최근 주문</div>
  ${state.orders.slice(0,5).map(o=>{const c=state.clinics.find(x=>x.id===o.clinicId);return `<div class="card order-card" onclick="openOrderSheet('${o.id}')"><div class="o-info"><div class="o-id">${o.id}</div><div class="o-name">${c?.name||'-'}</div><div class="o-meta">${fmtRel(o.createdAt)}</div></div><span class="st ${statusKlass(o.status)}">${STATUS_LABEL[o.status]}</span></div>`;}).join('')}`;
}

function rOrders(){
  return `<input type="text" class="search-input" placeholder="🔍 주문번호 검색..." oninput="filterOrders(this.value)">
  <div style="margin-top:14px;" id="order-list">
    ${state.orders.map(o=>{const c=state.clinics.find(x=>x.id===o.clinicId);return `<div class="card order-card" onclick="openOrderSheet('${o.id}')" data-search="${o.id} ${c?.name||''}"><div class="o-info"><div class="o-id">${o.id}</div><div class="o-name">${c?.name||'-'}</div><div class="o-meta">${fmtRel(o.createdAt)} · ${fmtKRW(o.pricing.base)}</div></div><span class="st ${statusKlass(o.status)}">${STATUS_LABEL[o.status]}</span></div>`;}).join('')}
  </div>`;
}

window.filterOrders=function(q){q=q.toLowerCase();document.querySelectorAll('#order-list .card').forEach(c=>{c.style.display=c.dataset.search.toLowerCase().includes(q)?'flex':'none';});};

function rScan(){
  return `<div class="scan-frame">📷</div>
  <button class="btn" onclick="alert('카메라 연동은 향후 구현 예정')">📷 QR 스캔 시작</button>
  <div style="margin-top:14px;">
    <div class="section-h">또는 주문번호 직접 입력</div>
    <input class="search-input" placeholder="ORD-2026-XXXX" id="scan-input">
    <button class="btn-ghost btn" style="margin-top:8px;" onclick="scanLookup()">조회</button>
  </div>
  <div class="section-h">최근 스캔</div>
  ${(state.recentScans||[]).slice(0,5).map(s=>`<div class="card order-card"><div class="o-info"><div class="o-name">${s.orderId}</div><div class="o-meta">${fmtRel(s.at)}</div></div></div>`).join('')||'<div class="empty">기록 없음</div>'}`;
}
window.scanLookup=function(){const id=document.getElementById('scan-input').value.trim();if(state.orders.find(o=>o.id===id)){state.recentScans=state.recentScans||[];state.recentScans.unshift({orderId:id,at:new Date().toISOString()});save();openOrderSheet(id);}else alert('주문 없음');};

function rMessages(){
  const notifs=(state.notifications||[]).filter(n=>n.to===currentRole);
  return notifs.length?notifs.map(n=>`<div class="notif-item ${n.read?'':'unread'}" onclick="markRead('${n.id}')"><div class="msg">${n.message}</div><div class="time">${fmtRel(n.at)}</div></div>`).join(''):'<div class="empty">📭<br><br>새 알림이 없습니다</div>';
}
window.markRead=function(id){const n=state.notifications.find(x=>x.id===id);if(n){n.read=true;save();render();}};

function rSettings(){
  return `<div class="section-h">현재 역할</div>
  ${ROLES.map(r=>`<div class="setting-row" onclick="setRole('${r}')"><span>${ROLE_LABEL[r]}</span>${currentRole===r?'<span style="color:var(--accent);">✓</span>':''}</div>`).join('')}
  <div class="section-h">데이터</div>
  <div class="setting-row" onclick="render()"><span>새로고침</span><span>↻</span></div>
  <div class="setting-row" onclick="if(confirm('localStorage 초기화?')){localStorage.removeItem('${KEY}');location.reload();}"><span style="color:var(--red);">데이터 초기화</span></div>
  <div class="section-h">정보</div>
  <div class="setting-row"><span>버전</span><span style="color:var(--muted);font-family:'JetBrains Mono';">v0.1 mobile</span></div>`;
}
window.setRole=function(r){currentRole=r;document.getElementById('role-name').textContent=ROLE_LABEL[r];render();};

function openSheet(type){
  const sb=document.getElementById('sheet-bg'),sh=document.getElementById('sheet'),body=document.getElementById('sheet-body');
  if(type==='new-order'){
    body.innerHTML=`<h2>➕ 신규 주문</h2><p style="color:var(--dim);font-size:12px;margin-bottom:14px;">전체 주문은 데스크탑에서 진행합니다.</p><a href="erp.html" class="btn" style="display:block;text-align:center;text-decoration:none;">데스크탑 ERP 열기</a>`;
  }
  sb.classList.add('open');sh.classList.add('open');
}
window.closeSheet=function(){document.getElementById('sheet-bg').classList.remove('open');document.getElementById('sheet').classList.remove('open');};

window.openOrderSheet=function(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const c=state.clinics.find(x=>x.id===o.clinicId);const p=state.patients.find(x=>x.id===o.patientId);
  const body=document.getElementById('sheet-body');
  body.innerHTML=`<h2>${o.id}</h2>
  <div style="margin-bottom:8px;"><span class="st ${statusKlass(o.status)}">${STATUS_LABEL[o.status]}</span></div>
  <div style="font-size:13px;line-height:1.9;margin-bottom:14px;">
    <div><span style="color:var(--dim);">치과:</span> ${c?.name||'-'}</div>
    <div><span style="color:var(--dim);">환자:</span> ${p?.name||'-'} (${p?.age||'-'}/${p?.sex||'-'})</div>
    <div><span style="color:var(--dim);">금액:</span> ${fmtKRW(o.pricing.base)}</div>
  </div>
  <button class="btn" onclick="advanceOrder('${o.id}')">상태 진행 →</button>
  <button class="btn btn-ghost" style="margin-top:6px;" onclick="closeSheet()">닫기</button>`;
  document.getElementById('sheet-bg').classList.add('open');
  document.getElementById('sheet').classList.add('open');
};
window.advanceOrder=function(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const idx=STATUS_FLOW.indexOf(o.status);// Block sidetrack states (e.g. rescan_requested) — desktop must handle those
if(idx<0){alert('이 상태는 데스크탑에서 처리하세요');return;}if(idx<STATUS_FLOW.length-1){o.status=STATUS_FLOW[idx+1];o.timeline.push({status:o.status,at:new Date().toISOString(),by:currentRole,note:'모바일에서 진행'});save();closeSheet();render();}};

document.getElementById('role-name').textContent=ROLE_LABEL[currentRole];
render();
window.addEventListener('storage',e=>{if(e.key===KEY)render();});
</script>
</body>
</html>
